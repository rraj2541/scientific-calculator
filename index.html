<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="top">
            <h2>Calculator</h2>

            <div class="top-buttons">

                <button class="scientific-btn" onclick="toggleScientific()">
                    fx
                </button>

                <button class="history-btn" onclick="toggleHistory()">
                    📜
                </button>

                <button class="toggle" onclick="toggleTheme()">
                    🌙
                </button>

            </div>
        </div>

        <input
            type="text"
            id="display"
            class="display"
            placeholder="0"
            readonly
        >

        <div class="action-buttons">
            <button class="copy-btn" onclick="copyResult()">
                📋 Copy Result
            </button>
        </div>

        <!-- Scientific Buttons -->
        <div class="scientific-buttons hidden" id="scientificPanel">

            <button onclick="appendFunction('sin(')">sin</button>
            <button onclick="appendFunction('cos(')">cos</button>
            <button onclick="appendFunction('tan(')">tan</button>
            <button onclick="appendFunction('log(')">log</button>
            <button onclick="appendFunction('ln(')">ln</button>

            <button onclick="appendFunction('sqrt(')">√</button>
            <button onclick="appendFunction('square(')">x²</button>
            <button onclick="appendFunction('power(')">xʸ</button>
            <button onclick="appendValue('π')">π</button>
            <button onclick="appendValue('e')">e</button>

        </div>

        <!-- Main Calculator -->
        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="deleteLast()">⌫</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <!-- History Panel -->
    <div class="history hidden" id="historyPanel">

        <div class="history-header">

            <h2>History</h2>

            <button class="close-history" onclick="toggleHistory()">
                ✕
            </button>

        </div>

        <div id="historyList" class="history-list"></div>

        <button class="clear-history" onclick="clearHistory()">
            🗑 Clear History
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
